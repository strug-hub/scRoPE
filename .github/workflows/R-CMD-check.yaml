name: R package release gates

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: "true"
      _R_CHECK_CRAN_INCOMING_: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Use the Ubuntu archive mirror for system dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Avoid the slow Azure mirror during both R and package dependency setup.
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: false
      - name: Build the source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scrope-release"
          cd "$RUNNER_TEMP/scrope-release"
          R CMD build --no-build-vignettes "$GITHUB_WORKSPACE"
          archives=(scRoPE_*.tar.gz)
          test "${#archives[@]}" -eq 1
          sha256sum "${archives[0]}" > source-archive.sha256
          echo "SCROPE_ARCHIVE=$PWD/${archives[0]}" >> "$GITHUB_ENV"
      - name: R CMD check including tests
        shell: Rscript {0}
        run: |
          result <- rcmdcheck::rcmdcheck(
            path = Sys.getenv("SCROPE_ARCHIVE"),
            args = c("--no-manual", "--no-build-vignettes"),
            error_on = "warning",
            check_dir = file.path(Sys.getenv("RUNNER_TEMP"), "scrope-check")
          )
          stopifnot(length(result$errors) == 0L, length(result$warnings) == 0L)
      - name: Install the checked archive with its tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scrope-gate-library"
          R CMD INSTALL --install-tests --library="$RUNNER_TEMP/scrope-gate-library" "$SCROPE_ARCHIVE"
      - name: Installed-package smoke and mandatory two-worker tests
        shell: bash
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/scrope-gate-library/scRoPE"
          Rscript "$package_path/tests/validation/run_workable_version_smoke.R" \
            "$RUNNER_TEMP/scrope-release/smoke.rds" "$package_path"
          Rscript "$package_path/tests/validation/run_installed_parallel_gate.R" \
            "$RUNNER_TEMP/scrope-release/parallel.rds" "$package_path"
      - name: Retain check and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-r-release-gates
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/scrope-check
            ${{ runner.temp }}/scrope-release
